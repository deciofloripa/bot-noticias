name: Feed Noticias

on:
  schedule:
    # Segunda a sexta
    # 07:00 UTC = 04:00 Brasília
    # 22:00 UTC = 19:00 Brasília
    #- cron: '*/15 7-21 * * 1-5'
    - cron: '*/15 * * * *'

  workflow_dispatch:

jobs:
  executar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
        run: |
          python feed_noticias_github.py
